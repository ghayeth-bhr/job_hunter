# programs.yaml — hand-curated funded internship/research programs.
#
# NOT CRAWLED, DELIBERATELY. This project spent real effort discovering that
# no combination of search queries reliably surfaces these -- verified live
# (2026-08-18): even a query naming "Mitacs Globalink Research Internship"
# directly never returned mitacs.ca itself in Google's top 10, only
# third-party mentions (Facebook posts, scholarship-aggregator sites). A
# scraper that silently mis-reads a deadline is worse than no scraper at all,
# because you would trust it. This file gets read directly and turned into
# opportunities via date arithmetic (tools/programs.py) -- no search engine,
# no scraping, no LLM.
#
# Entries below are ported from a sibling project (pfzebi/PFE-Hunter,
# github.com/OussemaBenAmeur/pfzebi) solving the identical problem for a
# classmate at the same school (ENISo) -- real, independently researched
# facts, not fabricated. `last_verified` matters: check the portal yourself
# before trusting a deadline that's gone stale.

programs:
  - name: "Mitacs Globalink Research Internship"
    org: Mitacs
    country: Canada
    apply_url: "https://www.mitacs.ca/en/programs/globalink/globalink-research-internship"
    deadline: "2027-02-01"
    eligibility: "Undergraduate/master's students at a partner institution; fully funded, explicitly supports international candidates including visa/permit guidance"
    last_verified: "2026-08-01"
    domains: ["Computer Vision", "Machine Learning", "Deep Learning", "AI Engineering"]

  - name: "DAAD RISE Worldwide"
    org: DAAD
    country: Germany
    apply_url: "https://www.daad.de/rise/en/"
    deadline: "2026-12-15"
    eligibility: "Undergraduate students, natural sciences/engineering; funded, designed for international students"
    last_verified: "2026-08-01"
    domains: ["Computer Vision", "Machine Learning", "Deep Learning"]

  - name: "Erasmus+ Traineeship"
