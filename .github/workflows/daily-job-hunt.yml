name: Daily Job Hunt

# Runs once a day for $0 (GitHub Actions free minutes cover this easily —
# a ~10 min/day job is well inside the free monthly quota). See
# .env.example for the free-tier API keys this needs as repo secrets.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily — adjust to taste
  workflow_dispatch: {} # lets you trigger a run manually to test

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persists the "already reported" job database between daily runs.
      # Without this, every run would look like the first run and re-report
      # everything — the whole point of tools/store.py is lost otherwise.
      - name: Restore seen-jobs database
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      # Your CV never touches git history: store it base64-encoded as a
      # repo secret (Settings → Secrets and variables → Actions → New
      # repository secret → CV_BASE64), e.g.:
      #   base64 -w0 my_cv.pdf | pbcopy   (macOS)
      #   certutil -encode my_cv.pdf cv.b64  (Windows, then strip header/footer lines)
      - name: Decode CV from secret
        env:
          CV_BASE64: ${{ secrets.CV_BASE64 }}
        run: echo "$CV_BASE64" | base64 --decode > cv_input.pdf

      - name: Run daily job hunt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_TO_EMAIL: ${{ secrets.SENDGRID_TO_EMAIL }}
          ENABLE_EMAIL: "true"
        run: python main.py cv_input.pdf

      # Cache save only writes once per unique key, so a run-id suffixed key
      # plus a prefix restore-key above is what lets this grow day over day.
      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-db-${{ github.run_id }}

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
